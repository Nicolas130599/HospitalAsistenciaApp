<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title><ui:insert name="titulo">Hospital San Gabriel</ui:insert> | Hospital San Gabriel</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
        <h:outputStylesheet library="css" name="hospital.css"/>
    </h:head>

    <h:body styleClass="bg-hospital">

        <!-- Barra de navegación adaptativa (se colapsa en móviles) -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-hospital shadow-sm">
            <div class="container">
                <h:link outcome="dashboard" styleClass="navbar-brand d-flex align-items-center gap-2">
                    <h:graphicImage library="img" name="logo_san_gabriel.jpeg" alt="Logo Hospital San Gabriel" styleClass="brand-logo"/>
                    <span>Hospital San Gabriel</span>
                </h:link>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                        aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
                        <li class="nav-item">
                            <h:link outcome="dashboard" styleClass="nav-link #{view.viewId eq '/dashboard.xhtml' ? 'active' : ''}">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="registro" styleClass="nav-link #{view.viewId eq '/registro.xhtml' ? 'active' : ''}">
                                <i class="bi bi-clipboard2-check"></i> Registrar asistencia
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="listado" styleClass="nav-link #{view.viewId eq '/listado.xhtml' ? 'active' : ''}">
                                <i class="bi bi-table"></i> Listado de asistencias
                            </h:link>
                        </li>
                    </ul>

                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i>
                            <h:outputText value=" #{loginBean.usuario.username}"/>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <span class="dropdown-item-text small text-muted">
                                    Rol: <h:outputText value="#{loginBean.usuario.rol}"/>
                                </span>
                            </li>
                            <li><hr class="dropdown-divider"/></li>
                            <li>
                                <h:form>
                                    <h:commandLink action="#{loginBean.logout}" styleClass="dropdown-item">
                                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                                    </h:commandLink>
                                </h:form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Alertas flotantes: aquí aparecen los mensajes globales de JSF -->
        <div class="alertas-flotantes position-fixed top-0 end-0 p-3">
            <h:panelGroup id="msgs" layout="block">
                <h:messages globalOnly="true"
                            infoClass="alert alert-success shadow-sm py-2 mb-2"
                            warnClass="alert alert-warning shadow-sm py-2 mb-2"
                            errorClass="alert alert-danger shadow-sm py-2 mb-2"
                            fatalClass="alert alert-danger shadow-sm py-2 mb-2"/>
            </h:panelGroup>
        </div>

        <div class="container py-4">
            <ui:insert name="contenido">Contenido de la página</ui:insert>
        </div>

        <footer class="text-center small text-suave py-4">
            Sistema Integrado de Gestión Hospitalaria &#169; 2026 - Hospital San Gabriel
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            //<![CDATA[
            // Las alertas flotantes desaparecen solas a los 5 segundos (también tras llamadas AJAX).
            function ocultarAlertas() {
                document.querySelectorAll('#msgs .alert').forEach(function (a) {
                    setTimeout(function () { a.remove(); }, 5000);
                });
            }
            ocultarAlertas();
            if (window.faces && faces.ajax) {
                faces.ajax.addOnEvent(function (d) { if (d.status === 'success') { ocultarAlertas(); } });
            }
            //]]>
        </script>
    </h:body>
</html>
