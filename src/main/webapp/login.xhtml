<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">

    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Ingresar | Hospital San Gabriel</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
        <h:outputStylesheet library="css" name="hospital.css"/>
    </h:head>

    <h:body styleClass="login-bg p-3">
        <div class="login-card">
            <div class="card card-hospital">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h:graphicImage library="img" name="logo_san_gabriel.jpeg" alt="Logo Hospital San Gabriel" styleClass="login-logo mb-3"/>
                        <h1 class="h4 text-hospital fw-bold mb-1">Hospital San Gabriel</h1>
                        <p class="text-suave small mb-0">Ingresa con tu usuario para gestionar la asistencia del personal</p>
                    </div>

                    <h:messages globalOnly="true" styleClass="list-unstyled mb-3"
                                infoClass="alert alert-success py-2 mb-2"
                                warnClass="alert alert-warning py-2 mb-2"
                                errorClass="alert alert-danger py-2 mb-2"
                                fatalClass="alert alert-danger py-2 mb-2"/>

                    <h:form id="formLogin">
                        <div class="mb-3">
                            <h:outputLabel for="username" value="Usuario" styleClass="form-label fw-semibold"/>
                            <h:inputText id="username" value="#{loginBean.username}" required="true"
                                         requiredMessage="Ingresa tu usuario"
                                         styleClass="form-control #{component.valid ? '' : 'is-invalid'}"
                                         pt:autocomplete="username" pt:autofocus="autofocus"/>
                            <h:message for="username" styleClass="invalid-feedback"/>
                        </div>
                        <div class="mb-4">
                            <h:outputLabel for="password" value="Contraseña" styleClass="form-label fw-semibold"/>
                            <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                                           requiredMessage="Ingresa tu contraseña"
                                           styleClass="form-control #{component.valid ? '' : 'is-invalid'}"
                                           pt:autocomplete="current-password"/>
                            <h:message for="password" styleClass="invalid-feedback"/>
                        </div>
                        <h:commandButton value="Ingresar" action="#{loginBean.login}" styleClass="btn btn-primary w-100 py-2"/>
                    </h:form>
                </div>
            </div>
            <p class="text-center small text-suave mt-3">Sistema Integrado de Gestión Hospitalaria &#169; 2026</p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </h:body>
</html>
